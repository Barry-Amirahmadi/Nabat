<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
  <defs>
    <radialGradient id="light" cx="76%" cy="16%" r="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#231409" stop-opacity="0.14"/>
    </radialGradient>
    <linearGradient id="fall" x1="1" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#E7A9BE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E7A9BE" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="102.4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="13" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.42"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1024" height="1024" fill="#FFF8EC"/>
    <rect width="1024" height="1024" fill="url(#fall)"/>
    <g filter="url(#soft)">
      <ellipse cx="512" cy="512" rx="297" ry="279" fill="#E7A9BE" opacity="0.9"/>
      <ellipse cx="631" cy="389" rx="137" ry="89" fill="#FFFFFF" opacity="0.3"/>
      <ellipse cx="334" cy="657" rx="202" ry="100" fill="#231409" opacity="0.16"/>
    </g>
    <rect width="1024" height="1024" fill="url(#light)"/>
  </g>
</svg>
